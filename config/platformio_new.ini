[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 57600
upload_port = COM3
monitor_port = COM3

monitor_filters = esp32_exception_decoder

lib_deps = 
  ESP32Async/AsyncTCP@^3.4.5
  ESP32Async/ESPAsyncWebServer@^3.8.1
  bblanchon/ArduinoJson@^6.21.2
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit GFX Library@^1.11.5
  h2zero/NimBLE-Arduino@^1.4.0

build_flags = 
  -DBLE_ENABLED=1

[env:esp32dev_debug]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 57600
upload_port = COM3
monitor_port = COM3

monitor_filters = esp32_exception_decoder

build_type = debug
build_flags = 
  -O0
  -g3
  -DDEBUG_ESP_PORT=Serial
  -DCORE_DEBUG_LEVEL=5
  -DBLE_ENABLED=1

lib_deps = 
  ESP32Async/AsyncTCP@^3.4.5
  ESP32Async/ESPAsyncWebServer@^3.8.1
  bblanchon/ArduinoJson@^6.21.2
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit GFX Library@^1.11.5
  h2zero/NimBLE-Arduino@^1.4.0
