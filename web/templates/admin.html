<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWASOAT - Admin</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
    <style>
        .navbar { background-color: #ffffff; border-bottom: 1px solid #d1d9e0; }
        .navbar-brand { color: #0366d6 !important; font-weight: bold; }
        .nav-link { color: #586069 !important; }
        .card { border: 1px solid #d1d9e0; border-radius: 6px; }
        .nav-pills .nav-link.active { background: #0366d6; color: #ffffff !important; }
        .nav-pills .nav-link { color: #24292e; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a href="/home" class="navbar-brand">← GWASOAT Admin</a>
            <div class="ms-auto"><a href="/auth/logout" class="nav-link d-inline">Logout</a></div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-3">
        <ul class="nav nav-pills mb-3" id="adminTabs">
            <li class="nav-item"><a class="nav-link active" data-tab="teachers" href="#">Teachers</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="departments" href="#">Departments</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="classes" href="#">Classes</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="courses" href="#">Courses</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="students" href="#">Students</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="timetable" href="#">Timetable</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="audit" href="#">Activity Log</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="insights" href="#">DB Insights</a></li>
        </ul>

        <div class="card p-3" id="tabContent">Loading...</div>
    </div>

    <script src="/static/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
    var currentTab = 'teachers';

    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/[&<>"']/g, function(c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    var TABLE_DEFS = {
        teachers:    ['Name', 'Email', 'Role'],
        departments: ['Name'],
        classes:     ['Name', 'Year', 'Dept', 'Batches'],
        courses:     ['Code', 'Name', 'Teacher', 'Students'],
        students:    ['ID', 'PRN', 'Roll', 'Name', 'Class', 'Batch', 'FP', 'Login']
    };

    // Proper singular labels per tab (avoids "Classe" from a naive /s$/ strip).
    var SINGULAR = {
        teachers: 'Teacher', departments: 'Department', classes: 'Class',
        courses: 'Course', students: 'Student', timetable: 'Timetable'
    };
    function singular(tab) { return SINGULAR[tab] || tab.replace(/s$/, ''); }

    function showTab(tab) {
        currentTab = tab;
        $('#adminTabs .nav-link').removeClass('active');
        $('[data-tab="'+tab+'"]').addClass('active');
        loadTabData(tab);
    }

    function loadTabData(tab) {
        $('#tabContent').html('<div class="text-muted p-3">Loading...</div>');
        if (tab === 'audit') { return loadAudit(); }
        if (tab === 'timetable') { return loadTimetable(); }
        if (tab === 'insights') { return loadInsights(); }
        $.get('/api/admin/' + tab, function(data) {
            $('#tabContent').html(buildTable(tab, data));
            GW.enhanceTable('#adminTable', { search: '#adminSearch', countEl: '#adminCount' });
            $('#adminCount').text(data.length + ' total');
        }).fail(function() {
            GW.toast('Could not load ' + tab, 'danger');
            $('#tabContent').html('<div class="text-muted p-3">Failed to load.</div>');
        });
    }

    function rowActions(tab, r) {
        var html = '';
        if (tab === 'classes') {
            html += '<button class="gw-row-btn" onclick="manageBatches(' + r.id + ',\'' + esc(r.name) + '\')">Batches</button>';
            html += '<button class="gw-row-btn" onclick="manageClassStudents(' + r.id + ',\'' + esc(r.name) + '\')">Students</button>';
        }
        if (tab === 'courses') html += '<button class="gw-row-btn" onclick="manageCourseStudents(' + r.id + ',\'' + esc(r.name) + '\')">Students</button>';
        if (tab === 'students' || tab === 'courses' || tab === 'classes') {
            html += '<button class="gw-row-btn" onclick="editItem(\'' + tab + '\',' + r.id + ')">Edit</button>';
        }
        if (tab === 'students') {
            html += '<button class="gw-row-btn" onclick="resetStudentPassword(' + r.id + ')">Reset PW</button>';
        }
        if (tab === 'teachers' && r.role === 'teacher') {
            html += '<button class="gw-row-btn" onclick="resetTeacherPassword(' + r.id + ')">Reset PW</button>';
        }
        html += '<button class="gw-row-btn gw-danger" onclick="deleteItem(\'' + tab + '\',' + r.id + ')">Delete</button>';
        return html;
    }

    function buildTable(tab, data) {
        var title = tab.charAt(0).toUpperCase() + tab.slice(1);
        var cols = TABLE_DEFS[tab] || [];
        var html = '<div class="d-flex justify-content-between align-items-center mb-3">';
        html += '<h5 class="mb-0">' + title + '</h5>';
        html += '<button class="btn btn-primary btn-sm" onclick="addItem(\'' + tab + '\')">+ Add ' + singular(tab) + '</button></div>';

        html += '<div class="gw-table-wrap">';
        html += '<div class="gw-table-toolbar"><input class="gw-table-search" id="adminSearch" placeholder="Search ' + tab + '...">';
        html += '<span class="gw-table-count" id="adminCount"></span></div>';
        html += '<div style="max-height:65vh;overflow:auto"><table class="gw-table" id="adminTable"><thead><tr>';
        cols.forEach(function(c) { html += '<th>' + c + '</th>'; });
        html += '<th data-gw-no-sort>Actions</th></tr></thead><tbody>';

        if (!data.length) {
            html += '<tr data-gw-empty><td class="gw-empty" colspan="' + (cols.length + 1) + '">No ' + tab + ' yet. Click \u201c+ Add\u201d to create one.</td></tr>';
        } else {
            data.forEach(function(r) {
                html += '<tr>';
                if (tab === 'teachers') {
                    html += '<td>' + esc(r.name) + '</td><td>' + esc(r.email) + '</td><td><span class="gw-pill gw-pill-' + (r.role === 'admin' ? 'info' : 'muted') + '">' + esc(r.role) + '</span></td>';
                } else if (tab === 'departments') {
                    html += '<td>' + esc(r.name) + '</td>';
                } else if (tab === 'classes') {
                    html += '<td>' + esc(r.name) + '</td><td>' + esc(r.year||'-') + '</td><td>' + esc(r.dept_name||'-') + '</td><td>' + esc(r.batches||'-') + '</td>';
                } else if (tab === 'courses') {
                    html += '<td>' + esc(r.code||'-') + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.teacher_name||'Unassigned') + '</td><td>' + esc(r.student_count) + '</td>';
                } else if (tab === 'students') {
                    var fp = r.registered ? '<span class="gw-pill gw-pill-success">Registered</span>' : '<span class="gw-pill gw-pill-danger">Not set</span>';
                    var login = r.login_email ? '<span class="gw-pill gw-pill-info" title="' + esc(r.login_email) + '">Account</span>' : '<span class="gw-pill gw-pill-muted">None</span>';
                    html += '<td>' + esc(r.id) + '</td><td>' + esc(r.prn||'-') + '</td><td>' + esc(r.roll_no||'-') + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.class_name||'-') + '</td><td>' + esc(r.batch_name||'-') + '</td><td>' + fp + '</td><td>' + login + '</td>';
                }
                html += '<td>' + rowActions(tab, r) + '</td></tr>';
            });
        }
        html += '</tbody></table></div></div>';
        return html;
    }

    function addItem(tab) {
        var fields = {};
        if (tab === 'teachers') { fields = {name:'Name',email:'Email',password:'Password'}; }
        else if (tab === 'departments') { fields = {name:'Department Name'}; }
        else if (tab === 'classes') { fields = {name:'Class Name',year:'Year'}; }
        else if (tab === 'courses') { fields = {name:'Course Name',code:'Code'}; }
        else if (tab === 'students') { fields = {name:'Student Name',prn:'PRN',roll_no:'Roll No',id:'Fingerprint ID'}; }

        var html = '<h6 class="mb-3">Add ' + singular(tab) + '</h6>';
        Object.keys(fields).forEach(function(k) {
            var type = (k === 'password') ? 'password' : (k === 'id' ? 'number' : 'text');
            html += '<label class="form-label small mb-1">' + fields[k] + '</label>';
            html += '<input type="' + type + '" class="form-control form-control-sm mb-2" id="add_' + k + '" placeholder="' + fields[k] + '">';
        });
        if (tab === 'classes') {
            html += '<label class="form-label small mb-1">Department</label><select class="form-select form-select-sm mb-2" id="add_department_id"><option value="">None</option></select>';
            $.get('/api/admin/departments', function(depts) { depts.forEach(function(d) { $('#add_department_id').append('<option value="'+d.id+'">'+esc(d.name)+'</option>'); }); });
        }
        if (tab === 'courses') {
            html += '<label class="form-label small mb-1">Teacher</label><select class="form-select form-select-sm mb-2" id="add_teacher_id"><option value="">Unassigned</option></select>';
            $.get('/api/admin/teachers', function(ts) {
                ts.filter(function(t){ return t.role === 'teacher'; }).forEach(function(t) {
                    $('#add_teacher_id').append('<option value="'+t.id+'">'+esc(t.name)+'</option>');
                });
            });
        }
        if (tab === 'students') {
            html += '<label class="form-label small mb-1">Class</label><select class="form-select form-select-sm mb-2" id="add_class_id"><option value="">None</option></select>';
            $.get('/api/admin/classes', function(cs) { cs.forEach(function(c) { $('#add_class_id').append('<option value="'+c.id+'">'+esc(c.name)+'</option>'); }); });
        }

        if ($('#addForm').length) $('#addForm').remove();
        $('#tabContent').prepend('<div class="card p-3 mb-3" id="addForm">' + html +
            '<div class="mt-2"><button class="btn btn-primary btn-sm" id="addSaveBtn" onclick="submitAdd(\'' + tab + '\')">Save</button> ' +
            '<button class="btn btn-outline-secondary btn-sm" onclick="$(\'#addForm\').remove()">Cancel</button></div></div>');
    }

    function submitAdd(tab) {
        var data = {};
        $('#addForm input, #addForm select').each(function() {
            var key = this.id.replace('add_', '');
            if (this.value) data[key] = this.value;
        });
        GW.btnLoading('#addSaveBtn', true, 'Saving...');
        $.post('/api/admin/' + tab, data, function() {
            $('#addForm').remove();
            GW.toast(singular(tab) + ' added', 'success');
            loadTabData(tab);
        }).fail(function(xhr) {
            GW.btnLoading('#addSaveBtn', false);
            GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not save', 'danger');
        });
    }

    function deleteItem(tab, id) {
        GW.confirm({ title: 'Delete ' + singular(tab), message: 'This cannot be undone. Continue?', okText: 'Delete', danger: true })
        .then(function(ok) {
            if (!ok) return;
            $.ajax({ url: '/api/admin/' + tab + '/' + id, method: 'DELETE',
                success: function() { GW.toast('Deleted', 'success'); loadTabData(tab); },
                error: function(xhr) { GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not delete', 'danger'); }
            });
        });
    }

    function manageBatches(classId, className) {
        GW.prompt({ title: 'Add batch', message: 'New batch for ' + className, placeholder: 'e.g. Batch A1' })
        .then(function(name) {
            if (!name) return;
            $.post('/api/admin/batches', {name: name, class_id: classId}, function() {
                GW.toast('Batch added to ' + className, 'success');
                loadTabData('classes');
            }).fail(function(xhr) { GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not add batch', 'danger'); });
        });
    }

    // ── Course → Students: view enrolled, remove, and add (filtered by class) ──
    function manageCourseStudents(courseId, courseName) {
        if ($('#assignPanel').length) $('#assignPanel').remove();
        var html = '<div class="card p-3 mb-3" id="assignPanel">'
            + '<div class="d-flex justify-content-between align-items-center mb-2">'
            + '<h6 class="mb-0">Students in ' + esc(courseName || ('course ' + courseId)) + '</h6>'
            + '<button class="btn btn-outline-secondary btn-sm" onclick="$(\'#assignPanel\').remove()">Close</button></div>'
            + '<div class="row g-3">'
            + '  <div class="col-md-6"><div class="small text-muted mb-1">Enrolled</div>'
            + '    <div style="max-height:40vh;overflow:auto"><table class="gw-table"><tbody id="enrolledBody"></tbody></table></div></div>'
            + '  <div class="col-md-6"><div class="small text-muted mb-1">Add students</div>'
            + '    <select class="form-select form-select-sm mb-2" id="assignClassFilter"><option value="">All classes</option></select>'
            + '    <div style="max-height:30vh;overflow:auto;border:1px solid #d1d9e0;border-radius:6px;padding:6px" id="availBox"></div>'
            + '    <button class="btn btn-primary btn-sm mt-2" id="btnEnrollSel" onclick="enrollSelected(' + courseId + ')">Add selected</button></div>'
            + '</div></div>';
        $('#tabContent').prepend(html);
        $.get('/api/admin/classes', function(cs) {
            cs.forEach(function(c){ $('#assignClassFilter').append('<option value="'+c.id+'">'+esc(c.name)+'</option>'); });
        });
        $('#assignClassFilter').change(function(){ loadAvailable(courseId, $(this).val()); });
        loadCourseEnrolled(courseId);
        loadAvailable(courseId, '');
    }
    function loadCourseEnrolled(courseId) {
        $.get('/api/admin/course/' + courseId + '/students', function(rows) {
            var h = '';
            rows.forEach(function(s) {
                h += '<tr><td>' + esc(s.roll_no || '-') + '</td><td>' + esc(s.name) + '</td><td>' + esc(s.batch_name || '') + '</td>'
                   + '<td><button class="gw-row-btn gw-danger" onclick="unenroll(' + courseId + ',' + s.id + ')">Remove</button></td></tr>';
            });
            $('#enrolledBody').html(h || '<tr data-gw-empty><td class="gw-empty" colspan="4">No students enrolled</td></tr>');
        });
    }
    function loadAvailable(courseId, classId) {
        $.get('/api/admin/course/' + courseId + '/available_students', {class_id: classId || ''}, function(rows) {
            if (!rows.length) { $('#availBox').html('<div class="text-muted small">All students in this filter are already enrolled.</div>'); return; }
            var h = '';
            rows.forEach(function(s) {
                h += '<label class="d-block small"><input type="checkbox" class="availChk" value="' + s.id + '"> '
                   + esc(s.roll_no ? (s.roll_no + ' · ') : '') + esc(s.name)
                   + (s.batch_name ? ' <span class="text-muted">(' + esc(s.batch_name) + ')</span>' : '') + '</label>';
            });
            $('#availBox').html(h);
        });
    }
    function enrollSelected(courseId) {
        var ids = $('.availChk:checked').map(function(){ return this.value; }).get();
        if (!ids.length) { GW.toast('Select at least one student', 'warning'); return; }
        GW.btnLoading('#btnEnrollSel', true, 'Adding...');
        $.post('/api/admin/course/' + courseId + '/students/bulk', {student_ids: ids.join(',')}, function(r) {
            GW.btnLoading('#btnEnrollSel', false);
            GW.toast(r.added + ' student(s) added', 'success');
            loadCourseEnrolled(courseId);
            loadAvailable(courseId, $('#assignClassFilter').val());
            loadTabData('courses');
        }).fail(function(xhr){ GW.btnLoading('#btnEnrollSel', false); GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not add', 'danger'); });
    }
    function unenroll(courseId, sid) {
        $.ajax({ url: '/api/admin/course/' + courseId + '/students/' + sid, method: 'DELETE', success: function() {
            GW.toast('Removed', 'success');
            loadCourseEnrolled(courseId);
            loadAvailable(courseId, $('#assignClassFilter').val());
        }});
    }
    window.manageCourseStudents = manageCourseStudents;
    window.enrollSelected = enrollSelected;
    window.unenroll = unenroll;

    // ── Class → Students: view class roster, assign selected to selected courses ──
    function manageClassStudents(classId, className) {
        if ($('#assignPanel').length) $('#assignPanel').remove();
        var html = '<div class="card p-3 mb-3" id="assignPanel">'
            + '<div class="d-flex justify-content-between align-items-center mb-2">'
            + '<h6 class="mb-0">Students in ' + esc(className) + '</h6>'
            + '<button class="btn btn-outline-secondary btn-sm" onclick="$(\'#assignPanel\').remove()">Close</button></div>'
            + '<div class="row g-3">'
            + '  <div class="col-md-7"><div class="small text-muted mb-1">Class roster '
            + '    (<a href="#" id="selAllStu">select all</a> / <a href="#" id="selNoneStu">none</a>)</div>'
            + '    <div style="max-height:45vh;overflow:auto"><table class="gw-table"><thead><tr><th data-gw-no-sort></th><th>Roll</th><th>Name</th><th>Batch</th><th>Courses</th></tr></thead><tbody id="classStuBody"></tbody></table></div></div>'
            + '  <div class="col-md-5"><div class="small text-muted mb-1">Assign selected students to courses</div>'
            + '    <div style="max-height:30vh;overflow:auto;border:1px solid #d1d9e0;border-radius:6px;padding:6px" id="courseBox"></div>'
            + '    <button class="btn btn-primary btn-sm mt-2" id="btnClassEnroll" onclick="classEnroll(' + classId + ')">Enroll into selected courses</button>'
            + '    <div class="small text-muted mt-1">Tip: leave students unchecked to enroll the whole class.</div></div>'
            + '</div></div>';
        $('#tabContent').prepend(html);
        $.get('/api/admin/classes/' + classId + '/students', function(rows) {
            var h = '';
            rows.forEach(function(s) {
                h += '<tr><td><input type="checkbox" class="classStuChk" value="' + s.id + '"></td>'
                   + '<td>' + esc(s.roll_no || '-') + '</td><td>' + esc(s.name) + '</td><td>' + esc(s.batch_name || '-') + '</td>'
                   + '<td class="small text-muted">' + esc(s.course_codes || '—') + '</td></tr>';
            });
            $('#classStuBody').html(h || '<tr data-gw-empty><td class="gw-empty" colspan="5">No students in this class</td></tr>');
        });
        $.get('/api/admin/courses', function(cs) {
            var h = '';
            cs.forEach(function(c){ h += '<label class="d-block small"><input type="checkbox" class="courseChk" value="' + c.id + '"> ' + esc((c.code ? c.code + ' · ' : '') + c.name) + '</label>'; });
            $('#courseBox').html(h || '<div class="text-muted small">No courses yet</div>');
        });
        $('#selAllStu').click(function(e){ e.preventDefault(); $('.classStuChk').prop('checked', true); });
        $('#selNoneStu').click(function(e){ e.preventDefault(); $('.classStuChk').prop('checked', false); });
    }
    function classEnroll(classId) {
        var courseIds = $('.courseChk:checked').map(function(){ return this.value; }).get();
        if (!courseIds.length) { GW.toast('Select at least one course', 'warning'); return; }
        var studentIds = $('.classStuChk:checked').map(function(){ return this.value; }).get();
        GW.btnLoading('#btnClassEnroll', true, 'Enrolling...');
        $.post('/api/admin/classes/' + classId + '/enroll',
            {course_ids: courseIds.join(','), student_ids: studentIds.join(',')}, function(r) {
            GW.btnLoading('#btnClassEnroll', false);
            GW.toast('Enrolled ' + r.students + ' student(s) into ' + r.courses + ' course(s)', 'success');
            manageClassStudents(classId, $('#assignPanel h6').text().replace('Students in ', ''));
        }).fail(function(xhr){ GW.btnLoading('#btnClassEnroll', false); GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not enroll', 'danger'); });
    }
    window.manageClassStudents = manageClassStudents;
    window.classEnroll = classEnroll;

    function resetStudentPassword(sid) {
        GW.confirm({ title: 'Reset student password',
            message: 'Reset this student\u2019s login password to the default?', okText: 'Reset' })
        .then(function(ok) {
            if (!ok) return;
            $.post('/api/admin/students/' + sid + '/reset_password', function(r) {
                GW.toast('Login: ' + r.email + '  ·  Password: ' + r.password, 'success', { duration: 9000 });
                loadTabData('students');
            }).fail(function(xhr) {
                GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not reset password', 'danger');
            });
        });
    }
    window.resetStudentPassword = resetStudentPassword;

    function resetTeacherPassword(uid) {
        GW.confirm({ title: 'Reset teacher password',
            message: 'Reset this teacher\u2019s login password to the default (teacher123)?', okText: 'Reset' })
        .then(function(ok) {
            if (!ok) return;
            $.post('/api/admin/teachers/' + uid + '/reset_password', function(r) {
                GW.toast('Login: ' + r.email + '  ·  Password: ' + r.password, 'success', { duration: 9000 });
                loadTabData('teachers');
            }).fail(function(xhr) {
                GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not reset password', 'danger');
            });
        });
    }
    window.resetTeacherPassword = resetTeacherPassword;

    // ── Edit ──
    function editItem(tab, id) {
        $.get('/api/admin/' + tab, function(rows) {
            var r = rows.filter(function(x){ return x.id === id; })[0];
            if (!r) { GW.toast('Item not found', 'danger'); return; }
            var fields = {};
            if (tab === 'students') fields = {name:'Name', prn:'PRN', roll_no:'Roll No'};
            else if (tab === 'courses') fields = {name:'Course Name', code:'Code'};
            else if (tab === 'classes') fields = {name:'Class Name', year:'Year'};
            var html = '<h6 class="mb-3">Edit ' + singular(tab) + '</h6>';
            Object.keys(fields).forEach(function(k) {
                html += '<label class="form-label small mb-1">' + fields[k] + '</label>';
                html += '<input class="form-control form-control-sm mb-2" id="edit_' + k + '" value="' + esc(r[k] || '') + '">';
            });
            if (tab === 'students') {
                html += '<label class="form-label small mb-1">Class</label><select class="form-select form-select-sm mb-2" id="edit_class_id"><option value="">None</option></select>';
                html += '<label class="form-label small mb-1">Batch</label><select class="form-select form-select-sm mb-2" id="edit_batch_id"><option value="">None</option></select>';
            }
            if (tab === 'courses') {
                html += '<label class="form-label small mb-1">Teacher</label><select class="form-select form-select-sm mb-2" id="edit_teacher_id"><option value="">Unassigned</option></select>';
            }
            if ($('#editForm').length) $('#editForm').remove();
            $('#tabContent').prepend('<div class="card p-3 mb-3" id="editForm">' + html +
                '<div class="mt-2"><button class="btn btn-primary btn-sm" id="editSaveBtn" onclick="submitEdit(\'' + tab + '\',' + id + ')">Save</button> ' +
                '<button class="btn btn-outline-secondary btn-sm" onclick="$(\'#editForm\').remove()">Cancel</button></div></div>');
            if (tab === 'students') {
                $.get('/api/admin/classes', function(cs) {
                    cs.forEach(function(c){ $('#edit_class_id').append('<option value="'+c.id+'"'+(c.id===r.class_id?' selected':'')+'>'+esc(c.name)+'</option>'); });
                    loadBatchOptions(r.class_id, r.batch_id);
                });
                $('#edit_class_id').change(function(){ loadBatchOptions($(this).val(), null); });
            }
            if (tab === 'courses') {
                $.get('/api/admin/teachers', function(ts) {
                    ts.filter(function(t){ return t.role === 'teacher'; }).forEach(function(t){
                        $('#edit_teacher_id').append('<option value="'+t.id+'"'+(t.id===r.teacher_id?' selected':'')+'>'+esc(t.name)+'</option>');
                    });
                });
            }
        });
    }
    function loadBatchOptions(classId, selectedBatch) {
        $('#edit_batch_id').html('<option value="">None</option>');
        if (!classId) return;
        $.get('/api/admin/classes/' + classId + '/batches', function(bs) {
            bs.forEach(function(b){ $('#edit_batch_id').append('<option value="'+b.id+'"'+(String(b.id)===String(selectedBatch)?' selected':'')+'>'+esc(b.name)+'</option>'); });
        });
    }
    function submitEdit(tab, id) {
        var data = {};
        $('#editForm input, #editForm select').each(function() { data[this.id.replace('edit_', '')] = this.value; });
        GW.btnLoading('#editSaveBtn', true, 'Saving...');
        $.post('/api/admin/' + tab + '/' + id + '/edit', data, function() {
            $('#editForm').remove();
            GW.toast('Saved', 'success');
            loadTabData(tab);
        }).fail(function(xhr) {
            GW.btnLoading('#editSaveBtn', false);
            GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not save', 'danger');
        });
    }

    // ── Timetable ──
    function loadTimetable() {
        $.get('/api/admin/timetable', function(data) {
            var html = '<div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Timetable</h5>';
            html += '<button class="btn btn-primary btn-sm" onclick="addTimetable()">+ Add Slot</button></div>';
            html += '<div class="gw-table-wrap"><div class="gw-table-toolbar"><input class="gw-table-search" id="adminSearch" placeholder="Search timetable..."><span class="gw-table-count" id="adminCount"></span></div>';
            html += '<div style="max-height:65vh;overflow:auto"><table class="gw-table" id="adminTable"><thead><tr><th>Day</th><th>Time</th><th>Course</th><th>Teacher</th><th>Room</th><th data-gw-no-sort>Actions</th></tr></thead><tbody>';
            if (!data.length) {
                html += '<tr data-gw-empty><td class="gw-empty" colspan="6">No timetable slots yet.</td></tr>';
            } else {
                data.forEach(function(r) {
                    html += '<tr><td>' + esc(r.day_name) + '</td><td>' + esc(r.start_time) + (r.end_time ? '–' + esc(r.end_time) : '') + '</td><td>' + esc((r.code ? r.code + ' - ' : '') + (r.course_name || '')) + '</td><td>' + esc(r.teacher_name || '-') + '</td><td>' + esc(r.room || '-') + '</td>';
                    html += '<td><button class="gw-row-btn gw-danger" onclick="deleteTimetable(' + r.id + ')">Delete</button></td></tr>';
                });
            }
            html += '</tbody></table></div></div>';
            $('#tabContent').html(html);
            GW.enhanceTable('#adminTable', { search: '#adminSearch', countEl: '#adminCount' });
            $('#adminCount').text(data.length + ' slots');
        });
    }
    function addTimetable() {
        var days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
        var html = '<h6 class="mb-3">Add Timetable Slot</h6>';
        html += '<label class="form-label small mb-1">Course</label><select class="form-select form-select-sm mb-2" id="tt_course_id"></select>';
        html += '<label class="form-label small mb-1">Day</label><select class="form-select form-select-sm mb-2" id="tt_day_of_week">';
        days.forEach(function(d, i){ html += '<option value="' + i + '">' + d + '</option>'; });
        html += '</select>';
        html += '<label class="form-label small mb-1">Start time</label><input type="time" class="form-control form-control-sm mb-2" id="tt_start_time">';
        html += '<label class="form-label small mb-1">End time</label><input type="time" class="form-control form-control-sm mb-2" id="tt_end_time">';
        html += '<label class="form-label small mb-1">Room</label><input class="form-control form-control-sm mb-2" id="tt_room" placeholder="e.g. Lab 3">';
        if ($('#addForm').length) $('#addForm').remove();
        $('#tabContent').prepend('<div class="card p-3 mb-3" id="addForm">' + html +
            '<div class="mt-2"><button class="btn btn-primary btn-sm" id="ttSaveBtn" onclick="submitTimetable()">Save</button> ' +
            '<button class="btn btn-outline-secondary btn-sm" onclick="$(\'#addForm\').remove()">Cancel</button></div></div>');
        $.get('/api/admin/courses', function(cs) { cs.forEach(function(c){ $('#tt_course_id').append('<option value="'+c.id+'">'+esc((c.code?c.code+' - ':'')+c.name)+'</option>'); }); });
    }
    function submitTimetable() {
        var data = { course_id: $('#tt_course_id').val(), day_of_week: $('#tt_day_of_week').val(),
            start_time: $('#tt_start_time').val(), end_time: $('#tt_end_time').val(), room: $('#tt_room').val() };
        if (!data.course_id || !data.start_time) { GW.toast('Course and start time required', 'warning'); return; }
        GW.btnLoading('#ttSaveBtn', true, 'Saving...');
        $.post('/api/admin/timetable', data, function() { $('#addForm').remove(); GW.toast('Slot added', 'success'); loadTimetable(); })
        .fail(function(xhr){ GW.btnLoading('#ttSaveBtn', false); GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not save', 'danger'); });
    }
    function deleteTimetable(id) {
        GW.confirm({title:'Delete slot', message:'Remove this timetable slot?', okText:'Delete', danger:true}).then(function(ok){
            if (!ok) return;
            $.ajax({url:'/api/admin/timetable/'+id, method:'DELETE', success:function(){ GW.toast('Deleted','success'); loadTimetable(); }});
        });
    }

    // ── Activity log (with action + date filters) ──
    function loadAudit() {
        var html = '<h5 class="mb-3">Activity Log</h5>';
        html += '<div class="d-flex gap-2 align-items-end flex-wrap mb-3">';
        html += '<div><label class="form-label small mb-0">Action</label><select class="form-select form-select-sm" id="auditAction" style="width:180px"><option value="">All actions</option></select></div>';
        html += '<div><label class="form-label small mb-0">From</label><input type="date" class="form-control form-control-sm" id="auditStart"></div>';
        html += '<div><label class="form-label small mb-0">To</label><input type="date" class="form-control form-control-sm" id="auditEnd"></div>';
        html += '<button class="btn btn-primary btn-sm" id="btnAuditFilter">Filter</button>';
        html += '<button class="btn btn-outline-secondary btn-sm" id="btnAuditClear">Clear</button></div>';
        html += '<div class="gw-table-wrap"><div class="gw-table-toolbar"><input class="gw-table-search" id="adminSearch" placeholder="Search activity..."><span class="gw-table-count" id="adminCount"></span></div>';
        html += '<div style="max-height:62vh;overflow:auto"><table class="gw-table" id="adminTable"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody id="auditBody"></tbody></table></div></div>';
        $('#tabContent').html(html);

        // Populate the action dropdown from the distinct actions in the log.
        $.get('/api/admin/audit/actions', function(actions) {
            actions.forEach(function(a){ $('#auditAction').append('<option value="' + esc(a) + '">' + esc(a) + '</option>'); });
        });
        $('#btnAuditFilter').click(fetchAudit);
        $('#btnAuditClear').click(function(){ $('#auditAction').val(''); $('#auditStart').val(''); $('#auditEnd').val(''); fetchAudit(); });
        fetchAudit();
    }
    function fetchAudit() {
        var p = {};
        if ($('#auditAction').val()) p.action = $('#auditAction').val();
        if ($('#auditStart').val()) p.start = $('#auditStart').val();
        if ($('#auditEnd').val()) p.end = $('#auditEnd').val();
        $.get('/api/admin/audit', p, function(data) {
            var html = '';
            if (!data.length) {
                html = '<tr data-gw-empty><td class="gw-empty" colspan="4">No activity for this filter.</td></tr>';
            } else {
                data.forEach(function(r) {
                    var isGrade = r.action === 'GRADE_INSERT' || r.action === 'GRADE_UPDATE';
                    var pill = isGrade ? 'gw-pill-success' : 'gw-pill-info';
                    html += '<tr><td>' + esc(r.created_at) + '</td><td>' + esc(r.user_name || '-') + '</td><td><span class="gw-pill ' + pill + '">' + esc(r.action) + '</span></td><td>' + esc(r.details || '') + '</td></tr>';
                });
            }
            $('#auditBody').html(html);
            GW.enhanceTable('#adminTable', { search: '#adminSearch', countEl: '#adminCount' });
            $('#adminCount').text(data.length + ' entries');
        }).fail(function(){ GW.toast('Could not load activity log', 'danger'); });
    }

    // ── DB Insights (admin dashboards, each backed by a SQL JOIN/GROUP BY) ──
    function loadInsights() {
        $('#tabContent').html('<div class="text-muted p-3">Loading insights...</div>');
        $.get('/api/admin/insights', function(d) {
            function card(title, subtitle, headers, rows, renderRow) {
                var h = '<div class="card p-3 mb-3"><h6 class="mb-1">' + title + '</h6>';
                h += '<div class="text-muted small mb-2">' + subtitle + '</div>';
                h += '<div class="gw-table-wrap"><table class="gw-table"><thead><tr>';
                headers.forEach(function(c){ h += '<th>' + c + '</th>'; });
                h += '</tr></thead><tbody>';
                if (!rows.length) {
                    h += '<tr data-gw-empty><td class="gw-empty" colspan="' + headers.length + '">No data yet.</td></tr>';
                } else {
                    rows.forEach(function(r){ h += '<tr>' + renderRow(r) + '</tr>'; });
                }
                h += '</tbody></table></div></div>';
                return h;
            }

            var html = '<h5 class="mb-3">DB Insights</h5>';
            html += '<p class="text-muted small">Each table below is computed by a single SQL query using JOINs and GROUP BY — no values are calculated in the application code.</p>';

            html += card('Average grade per course',
                'JOIN grades → courses, GROUP BY course, AVG(score/max_score).',
                ['Code', 'Course', 'Graded entries', 'Average %'],
                d.avg_grade_per_course, function(r) {
                    return '<td>' + esc(r.code || '-') + '</td><td>' + esc(r.course) + '</td>'
                         + '<td>' + r.graded_entries + '</td>'
                         + '<td>' + (r.graded_entries ? r.avg_percent + '%' : '-') + '</td>';
                });

            html += card('Attendance % per class',
                'JOIN class → sessions → session_attendance, GROUP BY class, AVG(status=\'Present\').',
                ['Class', 'Sessions', 'Attendance %'],
                d.attendance_per_class, function(r) {
                    return '<td>' + esc(r.class_name || '-') + '</td><td>' + r.sessions + '</td>'
                         + '<td>' + (r.marks ? r.attendance_percent + '%' : '-') + '</td>';
                });

            html += card('Sessions per teacher',
                'JOIN attendance_sessions → users (teacher), GROUP BY teacher.',
                ['Teacher', 'Sessions conducted', 'Courses'],
                d.sessions_per_teacher, function(r) {
                    return '<td>' + esc(r.teacher) + '</td><td>' + r.session_count + '</td>'
                         + '<td>' + r.courses_taught + '</td>';
                });

            $('#tabContent').html(html);
        }).fail(function() {
            GW.toast('Could not load insights', 'danger');
            $('#tabContent').html('<div class="text-muted p-3">Failed to load insights.</div>');
        });
    }

    $('#adminTabs .nav-link').click(function(e) { e.preventDefault(); showTab($(this).data('tab')); });
    showTab('teachers');
    </script>
</body>
</html>
