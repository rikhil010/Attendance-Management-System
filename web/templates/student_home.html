<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWASOAT - Student Portal</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
    <style>
        body { background-color: #f6f8fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
        .navbar { background-color: #ffffff; border-bottom: 1px solid #d1d9e0; }
        .navbar-brand { color: #0366d6 !important; font-weight: bold; }
        .nav-link { color: #586069 !important; }
        .nav-link:hover { color: #24292e !important; }
        .welcome-section { padding: 26px 0 10px; }
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #24292e; }
        .stat-card { background: #fff; border: 1px solid #d1d9e0; border-radius: 8px; padding: 16px 18px; }
        .stat-card .num { font-size: 26px; font-weight: 700; color: #0366d6; line-height: 1; }
        .stat-card .lbl { font-size: 12px; color: #586069; margin-top: 6px; }
        .course-card { background: #fff; border: 1px solid #d1d9e0; border-radius: 8px; padding: 18px; margin-bottom: 14px; transition: box-shadow 0.1s; cursor: pointer; }
        .course-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .course-code { color: #0366d6; font-weight: bold; font-size: 13px; }
        .course-name { font-size: 17px; font-weight: 600; margin: 4px 0; color: #24292e; }
        .course-meta { color: #586069; font-size: 13px; }
        .gw-tabs { display: flex; gap: 4px; border-bottom: 1px solid #d1d9e0; margin: 10px 0 20px; flex-wrap: wrap; }
        .gw-tab { padding: 9px 16px; cursor: pointer; font-size: 14px; font-weight: 600; color: #586069; border-bottom: 2px solid transparent; }
        .gw-tab:hover { color: #24292e; }
        .gw-tab.active { color: #0366d6; border-bottom-color: #0366d6; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .att-bar { height: 8px; border-radius: 4px; background: #e1e4e8; overflow: hidden; }
        .att-bar > span { display: block; height: 100%; background: #2ea44f; }
        .att-bar.low > span { background: #d73a49; }
        .pill-present { color: #22863a; font-weight: 600; }
        .pill-absent { color: #d73a49; font-weight: 600; }
        .id-chip { font-size: 12px; color: #586069; background: #eef1f5; padding: 2px 8px; border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand">GWASOAT · Student</span>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="/profile" class="nav-link"><span id="userName"></span></a>
                <a href="/auth/logout" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-section">
            <h4 id="welcomeMsg">Welcome</h4>
            <p class="text-muted mb-0" id="studentMeta"></p>
        </div>

        <div class="row g-3 mb-3" id="statsRow"></div>

        <div class="gw-tabs" id="tabs">
            <div class="gw-tab active" data-tab="courses">My Courses</div>
            <div class="gw-tab" data-tab="attendance">Attendance</div>
            <div class="gw-tab" data-tab="grades">Grades</div>
            <div class="gw-tab" data-tab="timetable">Timetable</div>
            <div class="gw-tab" data-tab="class">My Class</div>
        </div>

        <!-- Courses -->
        <div class="tab-pane active" id="pane-courses">
            <div id="courseList"><p class="text-muted">Loading courses...</p></div>
        </div>

        <!-- Attendance -->
        <div class="tab-pane" id="pane-attendance">
            <div class="section-title">Attendance by Course</div>
            <div class="gw-table-wrap">
                <div style="max-height:60vh;overflow:auto">
                    <table class="gw-table" id="attTable">
                        <thead><tr><th>Course</th><th>Held</th><th>Present</th><th>Absent</th><th>%</th><th></th></tr></thead>
                        <tbody id="attBody"><tr data-gw-empty><td class="gw-empty" colspan="6">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Grades -->
        <div class="tab-pane" id="pane-grades">
            <div class="section-title">My Grades</div>
            <div id="gradesList"><p class="text-muted">Loading grades...</p></div>
        </div>

        <!-- Timetable -->
        <div class="tab-pane" id="pane-timetable">
            <div class="section-title">Weekly Timetable</div>
            <div class="gw-table-wrap">
                <div style="max-height:60vh;overflow:auto">
                    <table class="gw-table" id="ttTable">
                        <thead><tr><th>Day</th><th>Start</th><th>End</th><th>Course</th><th>Teacher</th><th>Room</th></tr></thead>
                        <tbody id="ttBody"><tr data-gw-empty><td class="gw-empty" colspan="6">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Class -->
        <div class="tab-pane" id="pane-class">
            <div class="section-title">My Class</div>
            <div id="classInfo" class="mb-3"></div>
            <div class="gw-table-wrap">
                <div class="gw-table-toolbar">
                    <input class="gw-table-search" id="cmSearch" placeholder="Search classmates...">
                    <span class="gw-table-count" id="cmCount"></span>
                </div>
                <div style="max-height:50vh;overflow:auto">
                    <table class="gw-table" id="cmTable">
                        <thead><tr><th>Roll</th><th>Name</th><th>Batch</th></tr></thead>
                        <tbody id="cmBody"><tr data-gw-empty><td class="gw-empty" colspan="3">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/[&<>"']/g, function(c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    var loaded = { attendance:false, grades:false, timetable:false, class:false };

    // ── Tab switching (lazy load) ──
    $('#tabs').on('click', '.gw-tab', function() {
        var tab = $(this).data('tab');
        $('.gw-tab').removeClass('active');
        $(this).addClass('active');
        $('.tab-pane').removeClass('active');
        $('#pane-' + tab).addClass('active');
        if (tab === 'attendance' && !loaded.attendance) { loadAttendance(); }
        if (tab === 'grades' && !loaded.grades) { loadGrades(); }
        if (tab === 'timetable' && !loaded.timetable) { loadTimetable(); }
        if (tab === 'class' && !loaded.class) { loadClass(); }
    });

    // ── Identity + overview stats ──
    $.get('/api/student/me', function(d) {
        var s = d.student, a = d.account;
        $('#userName').text(a.name);
        $('#welcomeMsg').text('Welcome, ' + a.name);
        var meta = [];
        if (s.roll_no) meta.push('Roll ' + s.roll_no);
        if (s.prn) meta.push('PRN ' + s.prn);
        if (s.class_name) meta.push(s.class_name + (s.class_year ? ' (Year ' + s.class_year + ')' : ''));
        if (s.batch_name) meta.push('Batch ' + s.batch_name);
        $('#studentMeta').text(meta.join('  ·  '));
    }).fail(function(xhr) {
        if (xhr.status === 401 || xhr.status === 403) { window.location.href = '/login'; }
        else { GW.toast('Could not load your profile', 'danger'); }
    });

    // ── Courses (default tab) ──
    $.get('/api/student/courses', function(courses) {
        if (!courses.length) {
            $('#courseList').html('<p class="text-muted">You are not enrolled in any courses yet.</p>');
            return;
        }
        var html = '';
        courses.forEach(function(c) {
            html += '<div class="course-card" onclick="window.location.href=\'/student/course/' + c.id + '\'">';
            html += '<div class="course-code">' + esc(c.code || '') + '</div>';
            html += '<div class="course-name">' + esc(c.name) + '</div>';
            html += '<div class="course-meta">Teacher: ' + esc(c.teacher_name || 'TBA') + '</div>';
            html += '</div>';
        });
        $('#courseList').html(html);
    }).fail(function(){ $('#courseList').html('<p class="text-danger">Could not load courses.</p>'); });

    // ── Overview stat cards (from attendance + grades + courses) ──
    $.get('/api/student/attendance', function(d) {
        var cards = [
            [ (d.courses ? d.courses.length : 0), 'Courses' ],
            [ d.overall_percent + '%', 'Overall Attendance' ],
            [ d.total_present + '/' + d.total_held, 'Classes Attended' ]
        ];
        var html = '';
        cards.forEach(function(c) {
            html += '<div class="col-6 col-md-4"><div class="stat-card"><div class="num">' + c[0] + '</div><div class="lbl">' + c[1] + '</div></div></div>';
        });
        $('#statsRow').html(html);
    });

    // ── Attendance tab ──
    function loadAttendance() {
        loaded.attendance = true;
        $.get('/api/student/attendance', function(d) {
            var rows = '';
            (d.courses || []).forEach(function(c) {
                var low = c.percent < 75 ? ' low' : '';
                rows += '<tr>'
                    + '<td>' + esc((c.code ? c.code + ' - ' : '') + c.course_name) + '</td>'
                    + '<td>' + c.held + '</td>'
                    + '<td class="pill-present">' + c.present + '</td>'
                    + '<td class="pill-absent">' + c.absent + '</td>'
                    + '<td style="min-width:120px"><div class="d-flex align-items-center gap-2"><div class="att-bar' + low + '" style="flex:1"><span style="width:' + Math.min(c.percent,100) + '%"></span></div><span style="font-size:12px">' + c.percent + '%</span></div></td>'
                    + '<td><a class="gw-row-btn" href="/student/course/' + c.course_id + '">Details</a></td>'
                    + '</tr>';
            });
            $('#attBody').html(rows || '<tr data-gw-empty><td class="gw-empty" colspan="6">No attendance records yet</td></tr>');
            GW.enhanceTable('#attTable', {});
        });
    }

    // ── Grades tab ──
    function loadGrades() {
        loaded.grades = true;
        $.get('/api/student/grades', function(courses) {
            if (!courses.length) {
                $('#gradesList').html('<p class="text-muted">No grades have been published yet.</p>');
                return;
            }
            var html = '';
            courses.forEach(function(c) {
                html += '<div class="gw-table-wrap mb-3">';
                html += '<div class="gw-table-toolbar"><strong>' + esc((c.code ? c.code + ' - ' : '') + c.course_name) + '</strong></div>';
                html += '<table class="gw-table"><thead><tr><th>Component</th><th>Score</th><th>Grade</th><th>Remarks</th></tr></thead><tbody>';
                c.items.forEach(function(it) {
                    var score = (it.score === null ? '-' : it.score) + (it.max_score ? ' / ' + it.max_score : '');
                    html += '<tr><td>' + esc(it.component) + '</td><td>' + esc(score) + '</td><td>' + esc(it.grade || '-') + '</td><td>' + esc(it.remarks || '') + '</td></tr>';
                });
                html += '</tbody></table></div>';
            });
            $('#gradesList').html(html);
        }).fail(function(){ $('#gradesList').html('<p class="text-danger">Could not load grades.</p>'); });
    }

    // ── Timetable tab ──
    function loadTimetable() {
        loaded.timetable = true;
        $.get('/api/student/timetable', function(rows) {
            var html = '';
            rows.forEach(function(r) {
                html += '<tr><td>' + esc(r.day_name) + '</td><td>' + esc(r.start_time) + '</td><td>' + esc(r.end_time || '-') + '</td><td>' + esc((r.code ? r.code + ' - ' : '') + r.course_name) + '</td><td>' + esc(r.teacher_name || '-') + '</td><td>' + esc(r.room || '-') + '</td></tr>';
            });
            $('#ttBody').html(html || '<tr data-gw-empty><td class="gw-empty" colspan="6">No timetable entries</td></tr>');
            GW.enhanceTable('#ttTable', {});
        });
    }

    // ── Class tab ──
    function loadClass() {
        loaded.class = true;
        $.get('/api/student/class', function(d) {
            if (!d.class) {
                $('#classInfo').html('<p class="text-muted">You are not assigned to a class yet.</p>');
                $('#cmBody').html('<tr data-gw-empty><td class="gw-empty" colspan="3">No class</td></tr>');
                return;
            }
            var c = d.class;
            var chips = '<span class="id-chip">' + esc(c.name) + '</span>';
            if (c.year) chips += ' <span class="id-chip">Year ' + esc(c.year) + '</span>';
            if (c.dept_name) chips += ' <span class="id-chip">' + esc(c.dept_name) + '</span>';
            if (c.batch_name) chips += ' <span class="id-chip">Batch ' + esc(c.batch_name) + '</span>';
            $('#classInfo').html(chips);
            var rows = '';
            (d.classmates || []).forEach(function(m) {
                rows += '<tr><td>' + esc(m.roll_no || '-') + '</td><td>' + esc(m.name) + '</td><td>' + esc(m.batch_name || '-') + '</td></tr>';
            });
            $('#cmBody').html(rows || '<tr data-gw-empty><td class="gw-empty" colspan="3">No classmates found</td></tr>');
            $('#cmCount').text((d.classmates || []).length + ' students');
            GW.enhanceTable('#cmTable', { search: '#cmSearch', countEl: '#cmCount' });
        });
    }
    </script>
</body>
</html>
