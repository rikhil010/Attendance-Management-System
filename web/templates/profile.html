<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWASOAT - Profile</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
    <style>
        .navbar { background-color: #ffffff; border-bottom: 1px solid #d1d9e0; }
        .navbar-brand { color: #0366d6 !important; font-weight: bold; }
        .nav-link { color: #586069 !important; }
        .card { border: 1px solid #d1d9e0; border-radius: 6px; }
        .profile-avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg, #0366d6, #0a4fa0); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 700;
        }
        .stat-box { background: #f6f8fa; border: 1px solid #e6e9ee; border-radius: 6px; padding: 14px; text-align: center; }
        .stat-box .num { font-size: 22px; font-weight: 700; color: #0366d6; }
        .stat-box .lbl { font-size: 12px; color: #586069; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a href="/home" class="navbar-brand">← GWASOAT</a>
            <div class="ms-auto"><a href="/auth/logout" class="nav-link d-inline">Logout</a></div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 720px;">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="profile-avatar" id="avatar">U</div>
            <div>
                <h4 class="mb-0" id="hName">Loading...</h4>
                <span class="gw-pill gw-pill-info" id="hRole"></span>
            </div>
        </div>

        <div class="row g-3 mb-4" id="statsRow"></div>

        <div class="card p-4 mb-4">
            <h6 class="mb-3">Account details</h6>
            <div class="mb-3">
                <label class="form-label small">Name</label>
                <input type="text" class="form-control" id="pName">
            </div>
            <div class="mb-3">
                <label class="form-label small">Email</label>
                <input type="email" class="form-control" id="pEmail">
            </div>
            <button class="btn btn-primary btn-sm" id="btnSaveProfile">Save changes</button>
        </div>

        <div class="card p-4">
            <h6 class="mb-3">Change password</h6>
            <div class="mb-3">
                <label class="form-label small">Current password</label>
                <input type="password" class="form-control" id="curPw">
            </div>
            <div class="mb-3">
                <label class="form-label small">New password</label>
                <input type="password" class="form-control" id="newPw" placeholder="At least 6 characters">
            </div>
            <button class="btn btn-primary btn-sm" id="btnChangePw">Update password</button>
        </div>
    </div>

    <script src="/static/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
    function loadProfile() {
        $.get('/api/profile', function(u) {
            $('#avatar').text((u.name || 'U').charAt(0).toUpperCase());
            $('#hName').text(u.name);
            $('#hRole').text(u.role === 'admin' ? 'Administrator' : 'Teacher');
            $('#pName').val(u.name);
            $('#pEmail').val(u.email);
            var s = u.stats || {};
            var html = '';
            if (s.course_count !== undefined) html += statBox(s.course_count, 'Courses');
            html += statBox(s.session_count || 0, 'Sessions Run');
            $('#statsRow').html(html);
        }).fail(function() { window.location.href = '/login'; });
    }
    function statBox(num, lbl) {
        return '<div class="col"><div class="stat-box"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div></div>';
    }

    $('#btnSaveProfile').click(function() {
        var name = $('#pName').val().trim(), email = $('#pEmail').val().trim();
        if (!name || !email) { GW.toast('Name and email are required', 'warning'); return; }
        GW.btnLoading('#btnSaveProfile', true, 'Saving...');
        $.post('/api/profile', {name: name, email: email}, function() {
            GW.btnLoading('#btnSaveProfile', false);
            GW.toast('Profile updated', 'success');
            loadProfile();
        }).fail(function(xhr) {
            GW.btnLoading('#btnSaveProfile', false);
            GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not update', 'danger');
        });
    });

    $('#btnChangePw').click(function() {
        var cur = $('#curPw').val(), nw = $('#newPw').val();
        if (!cur || !nw) { GW.toast('Enter both passwords', 'warning'); return; }
        GW.btnLoading('#btnChangePw', true, 'Updating...');
        $.post('/api/profile/password', {current: cur, new: nw}, function() {
            GW.btnLoading('#btnChangePw', false);
            $('#curPw').val(''); $('#newPw').val('');
            GW.toast('Password updated', 'success');
        }).fail(function(xhr) {
            GW.btnLoading('#btnChangePw', false);
            GW.toast(xhr.responseJSON ? xhr.responseJSON.message : 'Could not update password', 'danger');
        });
    });

    loadProfile();
    </script>
</body>
</html>
