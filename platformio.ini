[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 115200
upload_port = COM6
monitor_port = COM6

monitor_filters = esp32_exception_decoder

board_build.partitions = huge_app.csv

build_flags = 
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_MISO=-1
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=2
  -DTFT_RST=4
  -DTFT_BL=22
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSPI_FREQUENCY=20000000

lib_deps = 
  ESP32Async/AsyncTCP@^3.4.5
  ESP32Async/ESPAsyncWebServer@^3.8.1
  bblanchon/ArduinoJson@^6.21.2
  bodmer/TFT_eSPI@^2.5.43

[env:esp32dev_debug]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 57600
upload_port = COM6
monitor_port = COM6

monitor_filters = esp32_exception_decoder

board_build.partitions = huge_app.csv

build_type = debug
build_flags = 
  -O0
  -g3
  -DDEBUG_ESP_PORT=Serial
  -DCORE_DEBUG_LEVEL=5
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_MISO=-1
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=2
  -DTFT_RST=4
  -DTFT_BL=22
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSPI_FREQUENCY=20000000

lib_deps = 
  ESP32Async/AsyncTCP@^3.4.5
  ESP32Async/ESPAsyncWebServer@^3.8.1
  bblanchon/ArduinoJson@^6.21.2
  bodmer/TFT_eSPI@^2.5.43
